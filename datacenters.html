<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Data Center Counties — Demographics Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --ink: #ffffff; --paper: #000000; --panel: #363636; --line: #666666; --accent: #d97a52;
    --op: #2E9BFF; --con: #FF8C32; --pro: #B983FF; --nodata: #b8b8b8;
    --mono: Arial, sans-serif;
    --sans: Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: var(--sans); background: var(--paper); color: var(--ink); }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline;
    justify-content: space-between; flex-wrap: wrap; gap: 10px; background: var(--paper); }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  header .sub { font-family: var(--mono); font-size: 11px; color: #6b6458; margin-top: 2px; }
  .controls { display: flex; gap: 10px; align-items: center; font-family: var(--mono); font-size: 17px; }
  .controls label { color: #ffffff; margin-right: 4px; font-weight: 700; }
  select { font-family: var(--mono); font-size: 17px; padding: 12px 16px; border: 2px solid var(--line);
    border-radius: 5px; background: var(--panel); color: var(--ink); min-width: 260px; }
  select option { background: #222222; color: #ffffff; }
  #main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; position: relative; }
  #sidebar { width: 360px; min-width: 360px; border-left: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 18px; }
  #sidebar h2 { font-size: 15px; margin: 0 0 2px 0; }
  #sidebar .loc { font-family: var(--mono); font-size: 11px; color: #6b6458; margin-bottom: 14px; }
  .stat-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #222222; font-size: 13px; }
  .stat-row .k { color: #ffffff; }
  .stat-row .v { font-family: var(--mono); font-weight: 600; }
  .badge { display: inline-block; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.04em; padding: 2px 7px; border-radius: 3px; color: #000000; font-weight: 700; }
  .badge.operational { background: var(--op); }
  .badge.construction { background: var(--con); }
  .badge.proposed { background: var(--pro); }
  .site-card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 8px 0; background: #1a1a1a; }
  .site-card .name { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
  .site-card .company { font-size: 11.5px; color: #6b6458; margin-bottom: 5px; }
  .site-card .meta { font-family: var(--mono); font-size: 10.5px; color: #948c7e; margin-top: 5px; }
  .site-card .note { font-size: 11px; color: #4a4438; margin-top: 6px; line-height: 1.45; }
  .placeholder { color: #ffffff; font-size: 13px; line-height: 1.6; padding-top: 30px; }
  .section-label { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: #ffffff; margin: 18px 0 6px 0; }
  .caveat { font-size: 10.5px; color: #a89f8f; margin-top: 3px; font-style: italic; }
  #legend { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.88); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 12px; font-family: var(--mono); font-size: 11px; z-index: 500; max-width: 230px; }
  #legend .title { font-weight: 700; margin-bottom: 6px; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; }
  #legend .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #legend .swatch { width: 13px; height: 13px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.35); }
  .leaflet-popup-content { font-family: var(--sans); font-size: 12.5px; }
  .leaflet-container { background: #000000; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>AI Data Center Counties</h1>
    </div>
    <div class="controls">
      <label for="colorMode">Change view:</label>
      <select id="colorMode">
        <optgroup label="Build">
          <option value="status">Build status</option>
          <option value="total_cost_usd">Est. investment ($)</option>
          <option value="most_recent_year">Most recent target/online year</option>
        </optgroup>
        <optgroup label="Demographics">
          <option value="avg_income">Avg. income</option>
          <option value="poverty_rate">Poverty rate</option>
          <option value="density">Population density</option>
          <option value="pct_white">% non-Hispanic white</option>
          <option value="pct_black">% Black</option>
          <option value="pct_hisp">% Hispanic</option>
        </optgroup>
      </select>
    </div>
  </header>
  <div id="main">
    <div id="map"></div>
    <div id="sidebar">
      <div class="placeholder">Click any shaded county to see which data center(s) are sited there, each site's estimated cost/timeline, and the county's demographics.</div>
    </div>
  </div>
</div>

const METRIC_LABELS = {
  total_cost_usd: "Est. investment", most_recent_year: "Most recent target/online year",
  avg_income: "Avg. income", poverty_rate: "Poverty rate (%)", density: "Density (/km\u00b2)",
  pct_white: "% non-Hispanic white", pct_black: "% Black", pct_hisp: "% Hispanic",
};

function fmtMetric(mode, v) {
  if (v === null || v === undefined) return "—";
  if (mode === "total_cost_usd") return "$" + (v/1e9).toFixed(1) + "B";
  if (mode === "most_recent_year") return String(Math.round(v));
  if (mode === "avg_income") return "$" + Math.round(v).toLocaleString();
  if (mode === "density") return Math.round(v).toLocaleString() + "/km\u00b2";
  return v.toFixed(1) + "%";
}

function quantileBreaks(values, n) {
  const sorted = [...values].sort((a,b)=>a-b);
  const breaks = [];
  for (let i = 1; i < n; i++) breaks.push(sorted[Math.floor((sorted.length-1)*(i/n))]);
  return breaks;
}
function colorForValue(value, breaks) {
  for (let i = 0; i < breaks.length; i++) if (value <= breaks[i]) return SEQ_COLORS[i];
  return SEQ_COLORS[SEQ_COLORS.length-1];
}

let currentMode = "status";
let map, geoLayer;

function styleFeature(feature) {
  const p = feature.properties;
  if (currentMode === "status") {
    return { fillColor: STATUS_COLORS[p.top_status], color: "#ffffff", weight: 0.8, fillOpacity: 0.88 };
  }
  const v = p[currentMode];
  if (v === null || v === undefined) {
    return { fillColor: NODATA_COLOR, color: "#ffffff", weight: 0.8, fillOpacity: 0.7 };
  }
  const values = COUNTY_DATA.features.map(f => f.properties[currentMode]).filter(x => x !== null && x !== undefined);
  const breaks = quantileBreaks(values, SEQ_COLORS.length);
  return { fillColor: colorForValue(v, breaks), color: "#ffffff", weight: 0.8, fillOpacity: 0.88 };
}

function renderSidebar(props) {
  const sidebar = document.getElementById("sidebar");
  const sitesHtml = props.sites.map(s => {
    return `
    <div class="site-card">
      <div class="name">${s.name}</div>
      <span class="badge ${s.status}">${s.status}</span>
    </div>`;
  }).join("");

  sidebar.innerHTML = `
    <h2>${props.county_name}, ${props.state}</h2>

    <div class="section-label">Investment &amp; timeline</div>
    <div class="stat-row"><span class="k">Total est. investment</span><span class="v">${props.total_cost_usd ? "$"+(props.total_cost_usd/1e9).toFixed(1)+"B" : "unknown"}</span></div>
    <div class="stat-row"><span class="k">Most recent ref. year</span><span class="v">${props.most_recent_year ?? "unknown"}</span></div>

    <div class="section-label">Sites in this county</div>
    ${sitesHtml}

    <div class="section-label">County demographics</div>
    <div class="stat-row"><span class="k">Avg. income</span><span class="v">$${props.avg_income.toLocaleString()}</span></div>
    <div class="stat-row"><span class="k">Poverty rate</span><span class="v">${props.poverty_rate}%</span></div>
    <div class="stat-row"><span class="k">Density</span><span class="v">${props.density ?? "—"} /km&sup2;</span></div>
    <div class="stat-row"><span class="k">% non-Hispanic white</span><span class="v">${props.pct_white}%</span></div>
    <div class="stat-row"><span class="k">% Black</span><span class="v">${props.pct_black}%</span></div>
    <div class="stat-row"><span class="k">% Hispanic</span><span class="v">${props.pct_hisp}%</span></div>
  `;
}

function loadStateBoundaries() {
  L.geoJSON(STATE_BOUNDARIES_DATA, {
    style: { color: "#999999", weight: 1.1, fill: false, interactive: false },
  }).addTo(map);
}

function initMap() {
  map = L.map("map", { zoomControl: true }).setView([39.5, -98.5], 4);
  loadStateBoundaries();

  geoLayer = L.geoJSON(COUNTY_DATA, {
    style: styleFeature,
    onEachFeature: (feature, layer) => {
      const p = feature.properties;
      layer.bindTooltip(`${p.county_name}, ${p.state} (${p.sites.length} site${p.sites.length > 1 ? "s" : ""})`);
      layer.on("click", () => renderSidebar(p));
      layer.on("mouseover", () => layer.setStyle({ weight: 2.2, color: "#d97a52" }));
      layer.on("mouseout", () => layer.setStyle(styleFeature(feature)));
    }
  }).addTo(map);
  updateLegend();
}

function updateLegend() {
  let el = document.getElementById("legend");
  if (el) el.remove();
  el = document.createElement("div");
  el.id = "legend";

  if (currentMode === "status") {
    el.innerHTML = `
      <div class="title">Build status</div>
      <div class="row"><div class="swatch" style="background:${STATUS_COLORS.operational}"></div>operational</div>
      <div class="row"><div class="swatch" style="background:${STATUS_COLORS.construction}"></div>under construction</div>
      <div class="row"><div class="swatch" style="background:${STATUS_COLORS.proposed}"></div>proposed</div>
    `;
  } else {
    const values = COUNTY_DATA.features.map(f => f.properties[currentMode]).filter(x => x !== null && x !== undefined);
    const breaks = quantileBreaks(values, SEQ_COLORS.length);
    let rows = "", lo = Math.min(...values);
    for (let i = 0; i < SEQ_COLORS.length; i++) {
      const hi = breaks[i] ?? Math.max(...values);
      rows += `<div class="row"><div class="swatch" style="background:${SEQ_COLORS[i]}"></div>${fmtMetric(currentMode, lo)}\u2013${fmtMetric(currentMode, hi)}</div>`;
      lo = hi;
    }
    rows += `<div class="row"><div class="swatch" style="background:${NODATA_COLOR}"></div>No data</div>`;
    el.innerHTML = `<div class="title">${METRIC_LABELS[currentMode]}</div>${rows}`;
  }
  document.getElementById("map").appendChild(el);
}

document.getElementById("colorMode").addEventListener("change", (e) => {
  currentMode = e.target.value;
  geoLayer.setStyle(styleFeature);
  updateLegend();
});

initMap();
</script>
