</style>

</div>

const VARS = {
  age:  {label:"Member age",                          fmt:"int",    log:false},
  ten:  {label:"Member tenure (years)",               fmt:"int",    log:false},
  lean: {label:"District lean (positive = more Republican)", fmt:"signed", log:false},
  inc:  {label:"District median income",              fmt:"money",  log:false},
  vol:  {label:"Trade volume",                        fmt:"money",  log:true},
  ntr:  {label:"Number of trades",                    fmt:"int",    log:true},
  late: {label:"Late filings",                        fmt:"int",    log:false}
};
const ORDER = ["inc","lean","age","ten","vol","ntr","late"];
const COLORS = {D:"#4a90d9", R:"#e05555", I:"#999999"};

function fmtVal(v, kind){
  if(kind==="signed") return (v>0?"+":"")+Math.round(v);
  if(kind==="int") return Math.round(v).toLocaleString();
  const a=Math.abs(v), s=v<0?"-":"";
  if(a>=1e6) return "$"+s+(Math.round(a/1e5)/10)+"M";
  if(a>=1e3) return "$"+s+Math.round(a/1e3)+"K";
  return "$"+s+Math.round(a);
}

const xsel=document.getElementById("xsel"), ysel=document.getElementById("ysel");
for(const k of ORDER){
  xsel.add(new Option(VARS[k].label,k));
  ysel.add(new Option(VARS[k].label,k));
}
xsel.value="inc"; ysel.value="vol";

function currentFilter(d){
  const f=document.getElementById("fsel").value;
  if(f==="traders") return d.tr===1;
  if(f==="dem") return d.pty==="D";
  if(f==="rep") return d.pty==="R";
  return true;
}
function colorFor(d){
  const c=document.getElementById("csel").value;
  if(c==="none") return "#bbbbbb";
  if(c==="pty") return COLORS[d.pty]||"#999";
  if(c==="sex") return d.sex==="F" ? "#b06fd6" : "#46b06a";
  if(c==="tr")  return d.tr===1 ? "#e05555" : "#888888";
  return "#bbb";
}
function legendItems(){
  const c=document.getElementById("csel").value;
  if(c==="pty") return [["Democrat","#4a90d9"],["Republican","#e05555"],["Independent","#999999"]];
  if(c==="sex") return [["Women","#b06fd6"],["Men","#46b06a"]];
  if(c==="tr")  return [["Traded","#e05555"],["Did not trade","#888888"]];
  return [];
}

function pearson(xs,ys){
  const n=xs.length; if(n<3) return {r:NaN,n:n};
  let mx=0,my=0; for(let i=0;i<n;i++){mx+=xs[i];my+=ys[i];} mx/=n; my/=n;
  let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy;}
  if(sxx===0||syy===0) return {r:NaN,n:n};
  return {r:sxy/Math.sqrt(sxx*syy), n:n, mx:mx, my:my, sxx:sxx, sxy:sxy};
}
function erf(x){
  const t=1/(1+0.3275911*Math.abs(x));
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return x>=0?y:-y;
}
function pValue(r,n){
  if(!isFinite(r)||n<4||Math.abs(r)>=1) return NaN;
  const z=0.5*Math.log((1+r)/(1-r));
  const Z=Math.abs(z)*Math.sqrt(n-3);
  return 2*(1-0.5*(1+erf(Z/Math.SQRT2)));
}
function niceTicks(min,max,count){
  if(min===max){min-=1;max+=1;}
  const span=max-min, step0=span/count, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const norm=step0/mag; let step;
  if(norm<1.5) step=1; else if(norm<3) step=2; else if(norm<7) step=5; else step=10;
  step*=mag;
  const start=Math.ceil(min/step)*step, ticks=[];
  for(let v=start; v<=max+step*0.5; v+=step) ticks.push(v);
  return ticks;
}
function logTicks(minv,maxv){
  const lo=Math.floor(Math.log10(minv)), hi=Math.ceil(Math.log10(maxv)), t=[];
  for(let e=lo;e<=hi;e++) t.push(Math.pow(10,e));
  return t;
}

function draw(){
  const cv=document.getElementById("plot"), ctx=cv.getContext("2d");
  const cssW=cv.clientWidth||880, cssH=Math.round(cssW*0.57);
  const dpr=window.devicePixelRatio||1;
  cv.width=cssW*dpr; cv.height=cssH*dpr; cv.style.height=cssH+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  const xk=xsel.value, yk=ysel.value;
  const xv=VARS[xk], yv=VARS[yk];
  const useLog=document.getElementById("logchk").checked;
  const xLog=xv.log && useLog, yLog=yv.log && useLog;

  let pts=[], excluded=0;
  for(const d of DATA){
    if(!currentFilter(d)) continue;
    let x=d[xk], y=d[yk];
    if(x==null||y==null){excluded++;continue;}
    if(xLog){ if(x<=0){excluded++;continue;} x=Math.log10(x);}
    if(yLog){ if(y<=0){excluded++;continue;} y=Math.log10(y);}
    pts.push({x:x,y:y,c:colorFor(d)});
  }

  const ML=70, MR=20, MT=42, MB=58;
  const W=cssW-ML-MR, H=cssH-MT-MB;

  ctx.fillStyle="#ffffff"; ctx.font="bold 16px Arial"; ctx.textAlign="left";
  ctx.fillText(yv.label+" vs "+xv.label, ML, 24);

  if(pts.length<3){
    ctx.fillStyle="#f66"; ctx.font="14px Arial";
    ctx.fillText("Not enough data for this selection.", ML, MT+30);
    document.getElementById("stats").innerHTML="";
    return;
  }

  let xmin=Math.min(...pts.map(p=>p.x)), xmax=Math.max(...pts.map(p=>p.x));
  let ymin=Math.min(...pts.map(p=>p.y)), ymax=Math.max(...pts.map(p=>p.y));
  const padx=(xmax-xmin)*0.04||1, pady=(ymax-ymin)*0.06||1;
  if(!xLog){xmin-=padx;xmax+=padx;} if(!yLog){ymin-=pady;ymax+=pady;}

  const px=v=> ML + (v-xmin)/(xmax-xmin)*W;
  const py=v=> MT + H - (v-ymin)/(ymax-ymin)*H;

  ctx.font="12px Arial";
  const xticks = xLog ? logTicks(Math.pow(10,xmin),Math.pow(10,xmax)) : niceTicks(xmin,xmax,6);
  ctx.textAlign="center"; ctx.textBaseline="top";
  for(const t of xticks){
    const tv = xLog ? Math.log10(t) : t;
    if(tv<xmin-1e-9||tv>xmax+1e-9) continue;
    const X=px(tv);
    ctx.strokeStyle="#333"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(X,MT); ctx.lineTo(X,MT+H); ctx.stroke();
    ctx.fillStyle="#bbb"; ctx.fillText(fmtVal(t,xv.fmt), X, MT+H+6);
  }
  const yticks = yLog ? logTicks(Math.pow(10,ymin),Math.pow(10,ymax)) : niceTicks(ymin,ymax,6);
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(const t of yticks){
    const tv = yLog ? Math.log10(t) : t;
    if(tv<ymin-1e-9||tv>ymax+1e-9) continue;
    const Y=py(tv);
    ctx.strokeStyle="#333"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(ML,Y); ctx.lineTo(ML+W,Y); ctx.stroke();
    ctx.fillStyle="#bbb"; ctx.fillText(fmtVal(t,yv.fmt), ML-8, Y);
  }

  ctx.strokeStyle="#999"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(ML,MT); ctx.lineTo(ML,MT+H); ctx.lineTo(ML+W,MT+H); ctx.stroke();

  ctx.fillStyle="#dddddd"; ctx.font="13px Arial"; ctx.textAlign="center"; ctx.textBaseline="top";
  ctx.fillText(xv.label + (xLog?" (log scale)":""), ML+W/2, cssH-20);
  ctx.save(); ctx.translate(16, MT+H/2); ctx.rotate(-Math.PI/2);
  ctx.textBaseline="middle"; ctx.fillText(yv.label + (yLog?" (log scale)":""), 0, 0); ctx.restore();

  for(const p of pts){
    ctx.beginPath(); ctx.arc(px(p.x),py(p.y),3.4,0,2*Math.PI);
    ctx.fillStyle=p.c; ctx.globalAlpha=0.8; ctx.fill(); ctx.globalAlpha=1;
  }

  const st=pearson(pts.map(p=>p.x),pts.map(p=>p.y));
  let statHtml="";
  if(isFinite(st.r)){
    const b=st.sxy/st.sxx, a=st.my-b*st.mx;
    ctx.strokeStyle="#dddddd"; ctx.lineWidth=1.8; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(px(xmin),py(a+b*xmin)); ctx.lineTo(px(xmax),py(a+b*xmax)); ctx.stroke();
    ctx.setLineDash([]);
    const p=pValue(st.r,st.n);
    statHtml = "<span><b>n</b> = "+st.n+"</span>"
             + "<span><b>correlation r</b> = "+st.r.toFixed(2)+"</span>"
             + "<span><b>R\u00b2</b> = "+(st.r*st.r).toFixed(2)+"</span>"
             + "<span><b>p</b> = "+(isFinite(p)?(p<0.001?"<0.001":p.toFixed(3)):"n/a")+"</span>";
  } else {
    statHtml = "<span><b>n</b> = "+pts.length+"</span><span>correlation not defined for this selection</span>";
  }
  if(excluded>0) statHtml += "<span style='color:#888'>("+excluded+" not shown)</span>";
  document.getElementById("stats").innerHTML=statHtml;

  const items=legendItems();
  if(items.length){
    let ly=MT+6; const lx=ML+W-140;
    ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.font="12px Arial";
    for(const [name,col] of items){
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(lx+6,ly+6,4,0,2*Math.PI); ctx.fill();
      ctx.fillStyle="#ccc"; ctx.fillText(name, lx+16, ly+6); ly+=18;
    }
  }
}

for(const id of ["xsel","ysel","csel","fsel","logchk"]){
  document.getElementById(id).addEventListener("change",draw);
}
window.addEventListener("resize",draw);
draw();
</script>
